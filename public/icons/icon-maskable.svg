<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for full maskable area -->
    <linearGradient id="maskableBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="maskableCrossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <!-- Accent Pulse Gradient -->
    <linearGradient id="maskablePulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#2dd4bf" />
      <stop offset="60%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <filter id="maskableElevate" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#021a19" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full Bleed Square Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#maskableBgGrad)" />
  <circle cx="256" cy="180" r="220" fill="#2dd4bf" opacity="0.16" />

  <!-- Centered Safe-Zone Content (Scaled to 76% to fit safely within the 410px circle) -->
  <g transform="translate(62, 62) scale(0.76)">
    <!-- Medical Cross Geometry -->
    <g filter="url(#maskableElevate)">
      <rect x="216" y="96" width="80" height="320" rx="24" fill="url(#maskableCrossGrad)" />
      <rect x="96" y="216" width="320" height="80" rx="24" fill="url(#maskableCrossGrad)" />
    </g>

    <!-- Clinical Pulse Rhythm -->
    <path
      d="M 120 256 L 195 256 L 222 195 L 248 317 L 274 235 L 292 272 L 306 256 L 392 256"
      fill="none"
      stroke="url(#maskablePulseGrad)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle cx="248" cy="317" r="7" fill="#5eead4" />
    <circle cx="222" cy="195" r="7" fill="#ffffff" />

    <!-- Stylized Rx Prescription Badge -->
    <g transform="translate(320, 320)">
      <circle cx="56" cy="56" r="56" fill="#042f2e" stroke="#2dd4bf" stroke-width="6" />
      <circle cx="56" cy="56" r="48" fill="#0f766e" />
      <text
        x="56"
        y="71"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="44"
        font-weight="900"
        font-style="italic"
        letter-spacing="-1px"
        fill="#ffffff"
        text-anchor="middle"
      >Rx</text>
    </g>
  </g>
</svg>
